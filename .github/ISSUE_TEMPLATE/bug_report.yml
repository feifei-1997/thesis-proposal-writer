name: Bug report
description: Report reproducible Skill, sandbox, packaging, or CQVIP behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, authorization headers, private papers, or personal research data.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Jenius version, and sandbox runtime
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include sanitized input and commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include structured error code and redacted logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private content, and personal data.
          required: true
